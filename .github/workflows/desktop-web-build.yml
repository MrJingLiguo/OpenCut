name: Desktop web build

# Packs the OpenCut web app into a single self-extracting Windows exe that
# runs the Next.js server locally and opens it in the browser (see
# desktop/launcher.ts and desktop/build.sh). Run it by hand from the Actions
# tab, or push a `desktop-v*` tag to also publish a GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Build
        shell: bash
        run: bash desktop/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: opencut-desktop-windows-x64
          path: dist/opencut-desktop-windows-x64.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opencut-desktop-windows-x64
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum opencut-desktop-windows-x64.exe > opencut-desktop-windows-x64.sha256
          gh release create "$GITHUB_REF_NAME" \
            opencut-desktop-windows-x64.exe opencut-desktop-windows-x64.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OpenCut ${GITHUB_REF_NAME}" \
            --notes "Single Windows exe running the OpenCut web editor locally. Double-click to start — it opens http://127.0.0.1:4173 in your browser. First launch extracts app files to %LOCALAPPDATA%\\OpenCut; server-side features (sign-in, feedback, online sound search) are unavailable offline."
