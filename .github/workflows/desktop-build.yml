name: Desktop build

# Builds the GPUI desktop app into a standalone Windows exe. Run it by hand
# from the Actions tab, or push a `v*` tag to also publish a GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Rust version
        id: pins
        shell: bash
        run: echo "rust=$(sed -n 's/^rust *= *"\(.*\)"/\1/p' .prototools)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install ${{ steps.pins.outputs.rust }} --profile minimal
          rustup default ${{ steps.pins.outputs.rust }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: cargo build --release --locked -p opencut-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: opencut-desktop-windows-x64
          path: target/release/opencut-desktop.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opencut-desktop-windows-x64
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum opencut-desktop.exe > opencut-desktop-windows-x64.sha256
          zip -q "opencut-${GITHUB_REF_NAME}-windows-x64.zip" opencut-desktop.exe
          gh release create "$GITHUB_REF_NAME" \
            "opencut-${GITHUB_REF_NAME}-windows-x64.zip" \
            "opencut-desktop-windows-x64.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OpenCut ${GITHUB_REF_NAME}" \
            --notes "Standalone Windows build of the OpenCut desktop app. Unzip and run opencut-desktop.exe — no installer or runtime needed."
